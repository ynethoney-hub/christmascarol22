                    {
                        en: "“Look at old Fezziwig,” Scrooge said.",
                        ko: "“늙은 페지위그를 봐,” 스크루지가 말했습니다.",
                        words: [
                            { word: "look at", meaning: "~을 보다" }
                        ],
                        grammar: "[명령문] 상대를 주목하게 하는 'Look at ~' 표현입니다."
                    },
                    {
                        en: "“He has the power to make us happy or unhappy.”",
                        ko: "“그는 우리를 행복하게도 불행하게도 만들 수 있는 힘을 가지고 있어.”",
                        words: [
                            { word: "power", meaning: "힘, 능력" },
                            { word: "unhappy", meaning: "불행한" }
                        ],
                        grammar: "[투부정사 형용사적 용법] 'to make us happy'가 앞의 명사 power를 꾸며줍니다."
                    },
                    {
                        en: "“He can make our work light or heavy.”",
                        ko: "“그는 우리의 일을 가볍게도 무겁게도 만들 수 있지.”",
                        words: [
                            { word: "light", meaning: "(일이) 가벼운, 수월한" },
                            { word: "heavy", meaning: "무거운, 버거운" }
                        ],
                        grammar: "[사역동사 make] make + 목적어(our work) + 목적격 보어(light or heavy 형용사) 구조입니다."
                    },
                    {
                        en: "Then Scrooge half whispered, “I wish I could say a word to my clerk now.”",
                        ko: "그러자 스크루지가 반쯤 속삭였습니다. “지금 내 점원에게 한 마디라도 할 수 있으면 좋을텐데.”",
                        words: [
                            { word: "half", meaning: "반쯤, 절반" },
                            { word: "whisper", meaning: "속삭이다" },
                            { word: "clerk", meaning: "사원, 점원" }
                        ],
                        grammar: "[가정법 과거 (I wish 가정법)] 현재 사실의 아쉬움을 나타낼 때 I wish 뒤에 과거 조동사 could를 씁니다."
                    }
                ]
            },
            {
                title: "Part 3: 후회와 과거로부터의 탈출",
                sentences: [
                    {
                        en: "The spirit had two more Christmases to show old Scrooge.",
                        ko: "유령에게는 늙은 스크루지에게 보여줄 두 번의 크리스마스가 더 남아 있었습니다.",
                        words: [
                            { word: "two more", meaning: "두 개 더의" }
                        ],
                        grammar: "[투부정사 형용사적 용법] 'to show'가 앞의 명사구(two more Christmases)를 수식합니다."
                    },
                    {
                        en: "On one, his younger self said goodbye to a girl.",
                        ko: "첫 번째 크리스마스에, 그의 젊은 시절의 자아는 한 소녀에게 작별 인사를 고했습니다.",
                        words: [
                            { word: "say goodbye to", meaning: "~에게 작별 인사를 하다" }
                        ],
                        grammar: "[전치사 on] 특정한 날이나 크리스마스 같은 시점을 나타낼 때 사용합니다."
                    },
                    {
                        en: "He wanted to work and earn money more than he wanted to be with her.",
                        ko: "그는 그녀와 함께 있는 것보다 일하고 돈을 더 많이 벌기를 원했습니다.",
                        words: [
                            { word: "earn money", meaning: "돈을 벌다" },
                            { word: "more than", meaning: "~보다 더" }
                        ],
                        grammar: "[비교급 표현] 'more than'을 이용해 두 가지 소망의 우선순위를 비교하고 있습니다."
                    },
                    {
                        en: "And then on a later Christmas, the spirit showed him the same girl, older and married.",
                        ko: "그리고 나서 더 나중의 크리스마스에, 유령은 그에게 그 똑같은 소녀를 나이가 들고 결혼한 모습으로 보여주었습니다.",
                        words: [
                            { word: "later", meaning: "나중의" },
                            { word: "married", meaning: "결혼한" }
                        ],
                        grammar: "[분사/형용사 보어구] 'older and married'는 소녀의 상태를 부가적으로 설명하는 목적격 보어 역할입니다."
                    },
                    {
                        en: "She lived happily in a house filled with children.",
                        ko: "그녀는 아이들로 가득 찬 집에서 행복하게 살고 있었습니다.",
                        words: [
                            { word: "happily", meaning: "행복하게" },
                            { word: "house", meaning: "집" }
                        ],
                        grammar: "[과거분사구 수식] 'filled with children'이 앞의 명사 house를 뒤에서 수식합니다."
                    },
                    {
                        en: "Her husband seemed a fine man, too.",
                        ko: "그녀의 남편 역시 멋진 사람처럼 보였습니다.",
                        words: [
                            { word: "husband", meaning: "남편" },
                            { word: "seem", meaning: "~처럼 보이다" },
                            { word: "fine", meaning: "좋은, 멋진" }
                        ],
                        grammar: "[감각/상태동사 seem] seem 뒤에 명사구(a fine man)가 와서 주어의 상태를 나타냅니다."
                    },
                    {
                        en: "“Take me back!” ordered Scrooge.",
                        ko: "“나를 돌려보내 줘!” 스크루지가 명령했습니다.",
                        words: [
                            { word: "take back", meaning: "돌려보내다, 데려다주다" },
                            { word: "order", meaning: "명령하다" }
                        ],
                        grammar: "[명령문] 감정에 북받쳐 유령에게 강하게 요구하는 직접 화법입니다."
                    },
                    {
                        en: "“I have seen enough!”",
                        ko: "“나는 충분히 보았어!”",
                        words: [
                            { word: "enough", meaning: "충분히" }
                        ],
                        grammar: "[현재완료 시제] 'have seen'은 과거부터 현재까지 충분히 보아온 경험/완료를 나타냅니다."
                    },
                    {
                        en: "He grabbed the spirit's cap.",
                        ko: "그는 유령의 모자를 낚아채듯 붙잡았습니다.",
                        words: [
                            { word: "grab", meaning: "움켜잡다, 낚아채다" }
                        ],
                        grammar: "[동사의 과거형] grabbed로 급박한 행동을 묘사합니다."
                    },
                    {
                        en: "And he pulled it down over the spirit's head to put out its light.",
                        ko: "그리고 그는 유령의 불빛을 끄기 위해 그것을 유령의 머리 위로 꾹 눌러 썼습니다.",
                        words: [
                            { word: "pull down", meaning: "끌어내리다" },
                            { word: "put out", meaning: "(불빛 등을) 끄다" }
                        ],
                        grammar: "[투부정사 부사적 용법] 'to put out its light'는 모자를 내린 목적('불을 끄기 위해서')을 나타냅니다."
                    },
                    {
                        en: "Suddenly, Scrooge was back in his room.",
                        ko: "갑자기, 스크루지는 자신의 방으로 돌아와 있었습니다.",
                        words: [
                            { word: "back", meaning: "제자리로, 돌아와서" }
                        ],
                        grammar: "[장소 전치사구] 'back in his room'으로 현재의 현실 장소를 나타냅니다."
                    },
                    {
                        en: "He fell into bed and was asleep in a moment.",
                        ko: "그는 침대에 쓰러지듯 누웠고 순식간에 잠들었습니다.",
                        words: [
                            { word: "fall into bed", meaning: "지쳐서 침대에 쓰러지듯 눕다" },
                            { word: "in a moment", meaning: "순식간에, 잠시 후에" }
                        ],
                        grammar: "[병렬 구조] fell과 was가 과거 동사로 연결되어 순차적인 동작/상태를 나타냅니다."
                    }
                ]
            }
        ];

        // 퀴즈 데이터
        const quizData = [
            {
                question: "1. 스크루지가 잠에서 깬 시간은 언제인가요?",
                options: ["새벽 1시경", "자정 정각", "아침 해가 뜰 무렵", "한밤중 12시"],
                answer: 0
            },
            {
                question: "2. 첫 번째 유령(Ghost of Christmas Past)의 머리 모양이나 빛은 어떠했나요?",
                options: ["방 안의 빛이 유령의 머리 꼭대기에서 나오고 있었다.", "얼굴에서 눈부신 태양 빛이 났다.", "머리 위에 촛불을 얹고 있었다.", "빛이 전혀 없이 어두컴컴했다."],
                answer: 0
            },
            {
                question: "3. 스크루지의 어린 시절 학교에서 만난 여동생의 이름은 무엇인가요?",
                options: ["마리(Marley)", "패니(Fanny)", "벨(Belle)", "에이미(Amy)"],
                answer: 1
            },
            {
                question: "4. 스크루지가 첫 직장에서 견학한 파티를 열어준 고용주의 이름은?",
                options: ["밥 크랫닛(Bob Cratchit)", "페지위그 씨(Mr. Fezziwig)", "제이콥 말리(Jacob Marley)", "스크루지 시니어"],
                answer: 1
            },
            {
                question: "5. 스크루지가 마지막 과거의 장면을 보고 보인 행동은 무엇인가요?",
                options: ["유령과 함께 춤을 추었다.", "유령의 모자를 머리 위로 눌러 유령의 불빛을 끄려고 했다.", "울면서 집 밖으로 도망쳤다.", "유령에게 화를 내며 쫓아내었다."],
                answer: 1
            }
        ];

        let currentPage = 0;
        let activeSentenceIndex = null; // 각 문장별 펼쳐짐 상태 관리 (인덱스 저장, 없으면 null)
        let currentMode = 'study';
        let currentQuizIndex = 0;
        let score = 0;

        // 모드 전환 함수
        function setMode(mode) {
            currentMode = mode;
            const studyDiv = document.getElementById('studyMode');
            const quizDiv = document.getElementById('quizMode');
            const btnStudy = document.getElementById('btnStudy');
            const btnQuiz = document.getElementById('btnQuiz');

            if (mode === 'study') {
                studyDiv.classList.remove('hidden');
                quizDiv.classList.add('hidden');
                btnStudy.className = "px-4 py-2 bg-white text-indigo-700 font-semibold rounded-lg shadow hover:bg-indigo-50 transition text-sm md:text-base";
                btnQuiz.className = "px-4 py-2 bg-indigo-700 text-white font-semibold rounded-lg shadow hover:bg-indigo-600 transition text-sm md:text-base";
                renderStudyPage();
            } else {
                studyDiv.classList.add('hidden');
                quizDiv.classList.remove('hidden');
                btnStudy.className = "px-4 py-2 bg-indigo-700 text-white font-semibold rounded-lg shadow hover:bg-indigo-600 transition text-sm md:text-base";
                btnQuiz.className = "px-4 py-2 bg-white text-indigo-700 font-semibold rounded-lg shadow hover:bg-indigo-50 transition text-sm md:text-base";
                currentQuizIndex = 0;
                score = 0;
                renderQuiz();
            }
        }

        // 페이지 변경
        function changePage(direction) {
            const newPage = currentPage + direction;
            if (newPage >= 0 && newPage < storyPages.length) {
                currentPage = newPage;
                activeSentenceIndex = null; // 페이지 이동 시 초기화
                renderStudyPage();
                window.scrollTo({ top: 0, behavior: 'smooth' });
            }
        }

        // 학습 페이지 렌더링 (각 문장 아래에 설명 카드 인라인 삽입)
        function renderStudyPage() {
            const pageData = storyPages[currentPage];
            document.getElementById('partTitle').innerText = pageData.title;
            document.getElementById('pageIndicator').innerText = `Part ${currentPage + 1} / ${storyPages.length}`;
            
            const container = document.getElementById('textContent');
            container.innerHTML = '';

            pageData.sentences.forEach((item, index) => {
                const isOpen = activeSentenceIndex === index;
                
                // 문장 래퍼 박스
                const wrapper = document.createElement('div');
                wrapper.className = `sentence-item rounded-xl border transition-all ${isOpen ? 'bg-blue-50/60 border-blue-300 shadow-sm' : 'bg-white border-slate-200 hover:border-indigo-200 hover:bg-slate-50/50'}`;
                
                // 본문 문장 헤더 부분
                let html = `
                    <div class="p-4 cursor-pointer flex items-start justify-between gap-3" onclick="toggleSentence(${index})">
                        <div class="flex items-start gap-3 flex-grow">
                            <span class="text-xs font-bold text-indigo-600 bg-indigo-100 px-2 py-0.5 rounded mt-1 shrink-0">${index + 1}</span>
                            <p class="font-medium text-slate-800 text-base md:text-lg leading-relaxed">${item.en}</p>
                        </div>
                        <div class="flex items-center gap-2 shrink-0">
                            <button onclick="event.stopPropagation(); speakText('${item.en.replace(/'/g, "\\'")}')" class="text-slate-400 hover:text-indigo-600 p-2 rounded-full hover:bg-slate-200 transition" title="음성 듣기">
                                🔊
                            </button>
                            <span class="text-slate-400 text-sm font-semibold transition-transform duration-200 ${isOpen ? 'rotate-180 text-indigo-600' : ''}">▼</span>
                        </div>
                    </div>
                `;

                // 클릭되어 열려있을 때 바로 아래에 나타나는 설명 박스
                if (isOpen) {
                    let wordsHtml = item.words.map(w => `
                        <div class="bg-white border border-indigo-100 p-2.5 rounded-lg shadow-2xs">
                            <span class="font-bold text-indigo-900 block text-xs md:text-sm">${w.word}</span>
                            <span class="text-slate-600 block text-xs mt-0.5">${w.meaning}</span>
                        </div>
                    `).join('');

                    html += `
                        <div class="px-4 pb-4 pt-1 border-t border-blue-100 space-y-4 animate-fadeIn">
                            <!-- 해석 박스 -->
                            <div class="bg-indigo-50/80 p-3.5 rounded-xl border border-indigo-100 flex items-start justify-between gap-2">
                                <div>
                                    <span class="text-xs font-bold text-indigo-500 uppercase tracking-wider block mb-1">우리말 해석</span>
                                    <p class="text-sm md:text-base font-semibold text-indigo-950">${item.ko}</p>
                                </div>
                                <button onclick="speakText('${item.en.replace(/'/g, "\\'")}')" class="text-xs bg-indigo-600 text-white px-2.5 py-1.5 rounded-md hover:bg-indigo-700 transition shrink-0 shadow-xs">
                                    🔊 발음
                                </button>
                            </div>

                            <!-- 주요 단어 -->
                            <div>
                                <h4 class="text-xs font-bold text-slate-400 uppercase tracking-wider mb-2">주요 단어 및 표현</h4>
                                <div class="grid grid-cols-2 md:grid-cols-3 gap-2">
                                    ${wordsHtml}
                                </div>
                            </div>

                            <!-- 핵심 문법 -->
                            <div>
                                <h4 class="text-xs font-bold text-slate-400 uppercase tracking-wider mb-1">중3 핵심 문법 포인트</h4>
                                <div class="bg-amber-50 border border-amber-200 p-3 rounded-xl text-xs text-amber-900 leading-relaxed font-medium">
                                    💡 ${item.grammar}
                                </div>
                            </div>
                        </div>
                    `;
                }

                wrapper.innerHTML = html;
                container.appendChild(wrapper);
            });

            const isFirst = currentPage === 0;
            const isLast = currentPage === storyPages.length - 1;
            
            document.getElementById('prevPageBtn').disabled = isFirst;
            document.getElementById('nextPageBtn').disabled = isLast;
            document.getElementById('prevPageBtnBottom').disabled = isFirst;
            document.getElementById('nextPageBtnBottom').disabled = isLast;
        }

        // 문장 클릭 시 토글 동작
        function toggleSentence(index) {
            if (activeSentenceIndex === index) {
                activeSentenceIndex = null; // 이미 열려있으면 닫기
            } else {
                activeSentenceIndex = index; // 클릭한 문장 열기
            }
            renderStudyPage();
        }

        // Web Speech API를 활용한 음성 재생
        function speakText(text) {
            if ('speechSynthesis' in window) {
                window.speechSynthesis.cancel(); // 이전 재생 취소
                const utterance = new SpeechSynthesisUtterance(text);
                utterance.lang = 'en-US';
                utterance.rate = 0.9; // 조금 천천히 (중3 학습용)
                window.speechSynthesis.speak(utterance);
            }
        }

        // 퀴즈 렌더링
        function renderQuiz() {
            const container = document.getElementById('quizContainer');
            if (currentQuizIndex >= quizData.length) {
                container.innerHTML = `
                    <div class="text-center py-8 space-y-4">
                        <div class="inline-flex p-4 bg-green-100 text-green-600 rounded-full text-3xl mb-2">🎉</div>
                        <h3 class="text-xl md:text-2xl font-bold text-slate-800">퀴즈를 모두 완료했습니다!</h3>
                        <p class="text-slate-600 text-base md:text-lg">총 5문항 중 <span class="font-bold text-indigo-600">${score}문항</span>을 맞추셨습니다.</p>
                        <button onclick="setMode('study')" class="mt-4 px-6 py-2.5 bg-indigo-600 text-white font-semibold rounded-xl hover:bg-indigo-700 transition shadow">
                            본문 다시 학습하기
                        </button>
                    </div>
                `;
                document.getElementById('quizProgress').innerText = "완료";
                return;
            }

            const q = quizData[currentQuizIndex];
            document.getElementById('quizProgress').innerText = `문제 ${currentQuizIndex + 1} / ${quizData.length}`;

            let optionsHtml = '';
            q.options.forEach((opt, idx) => {
                optionsHtml += `
                    <button onclick="checkAnswer(${idx})" class="w-full text-left p-3.5 md:p-4 rounded-xl border border-slate-200 hover:border-indigo-500 hover:bg-indigo-50/50 transition font-medium text-slate-700 shadow-sm flex items-center justify-between group">
                        <span class="text-sm md:text-base">${opt}</span>
                        <span class="w-6 h-6 rounded-full border border-slate-300 flex items-center justify-center text-xs text-slate-400 group-hover:border-indigo-500 group-hover:text-indigo-600 shrink-0">${idx + 1}</span>
                    </button>
                `;
            });

            container.innerHTML = `
                <div class="space-y-6">
                    <h3 class="text-base md:text-lg font-bold text-slate-800 leading-snug">${q.question}</h3>
                    <div class="space-y-3">
                        ${optionsHtml}
                    </div>
                </div>
            `;
        }

        // 정답 체크
        function checkAnswer(selectedIdx) {
            const q = quizData[currentQuizIndex];
            const container = document.getElementById('quizContainer');

            if (selectedIdx === q.answer) {
                score++;
                container.innerHTML = `
                    <div class="text-center py-8 space-y-4">
                        <div class="text-2xl md:text-4xl text-green-500 font-bold">정답입니다! 👏</div>
                        <p class="text-slate-600">훌륭합니다. 다음 문제로 이동합니다.</p>
                        <button onclick="nextQuiz()" class="px-6 py-2.5 bg-indigo-600 text-white font-semibold rounded-xl hover:bg-indigo-700 transition shadow">
                            다음 문제
                        </button>
                    </div>
                `;
            } else {
                container.innerHTML = `
                    <div class="text-center py-8 space-y-4">
                        <div class="text-2xl md:text-4xl text-rose-500 font-bold">아쉽네요! 😅</div>
                        <p class="text-slate-600">정답은 <b>"${q.options[q.answer]}"</b> 입니다.</p>
                        <button onclick="nextQuiz()" class="px-6 py-2.5 bg-indigo-600 text-white font-semibold rounded-xl hover:bg-indigo-700 transition shadow">
                            다음 문제
                        </button>
                    </div>
                `;
            }
        }

        function nextQuiz() {
            currentQuizIndex++;
            renderQuiz();
        }

        // 초기 실행
        window.onload = function() {
            renderStudyPage();
        };
    </script>
</body>
</html>
